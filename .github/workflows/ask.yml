name: Ask my README

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

concurrency:
  group: ask-my-readme
  cancel-in-progress: false

jobs:
  answer:
    if: startsWith(github.event.issue.title, 'Ask:') && github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Daily limit
        id: limit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(date -u +%Y-%m-%d)
          count=$(gh api "search/issues?q=repo:${{ github.repository }}+label:answered+created:>=$today&per_page=1" --jq '.total_count')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Too many questions today
        if: steps.limit.outputs.count >= 40
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --body "🤖 I've answered a lot of questions today and I'm resting. Please try again tomorrow, or reach Turabi on [LinkedIn](https://www.linkedin.com/in/muhammedturabisancak/)."
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}

      - name: Ask Claude
        if: steps.limit.outputs.count < 40
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          OUT: ${{ runner.temp }}/answer.md
        run: python3 .github/ask/answer.py

      - name: Reply and close
        if: steps.limit.outputs.count < 40
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file "${{ runner.temp }}/answer.md"
          gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label answered
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
