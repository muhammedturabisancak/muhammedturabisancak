name: Latest Medium posts

on:
  schedule:
    - cron: "41 4 * * *"   # every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@muhammedturabisancak"
          max_post_count: 3
