name: Ask my README
description: Ask anything about Turabi's work — an AI answers in a few seconds.
title: "Ask: "
labels: ["ask"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question (or just write it in the title)
      description: About my experience, stack, projects or community work. Keep it short.
      placeholder: Which state management do you use in Flutter?
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        The answer is generated by an LLM from a short profile I wrote, so it may be imperfect.
        For anything serious, reach me on [LinkedIn](https://www.linkedin.com/in/muhammedturabisancak/).
